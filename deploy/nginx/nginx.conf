worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server person-service:8080;
    }

    upstream finance_service {
        server finance-service:8080;
    }

    server {
        listen 80;
        server_name _;

        location /api/users/swagger {
            proxy_pass http://person-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/finance/swagger {
            proxy_pass http://finance-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location = /api/users/ {
            proxy_pass http://person-service:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location = /api/finance/ {
            proxy_pass http://finance-service:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }
        
        error_page 401 = @unauthorized;
        location @unauthorized {
            return 401 '{"error": "Unauthorized: valid JWT required"}';
            add_header Content-Type application/json;
        }
    }
}