services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1qaz@WSX
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration-service:
    build:
      context: ../src/DbMigrator
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__UsersDb: "Host=postgres;Port=5432;Database=users;Username=admin;Password=1qaz@WSX"
      ConnectionStrings__FinancyDb: "Host=postgres;Port=5432;Database=financy;Username=admin;Password=1qaz@WSX"
    depends_on:
      postgres:
        condition: service_healthy

  person-service:
    build:
      context: ../src/PersonService
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=users;Username=admin;Password=1qaz@WSX"
      Jwt__Issuer: "http://person-service:8080"
    ports:
      - "8080:8080"
    depends_on:
      migration-service:
        condition: service_completed_successfully
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    #   interval: 10s
    #   retries: 5
    #   start_period: 30s
    #   timeout: 10s

  currency-scheduler:
    build:
      context: ../src/CurrencyScheduler
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=financy;Username=admin;Password=1qaz@WSX"
    depends_on:
      migration-service:
        condition: service_completed_successfully

  finance-service:
    build:
      context: ../src/FinanceService
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=financy;Username=admin;Password=1qaz@WSX"
      Jwt__Authority: "http://person-service:8080"
      Jwt__Audience: "UserServiceClients"
      Jwt__Issuer: "UserService"
    ports:
      - "8081:8080"
    depends_on:
      person-service:
        condition: service_started

volumes:
  postgres_data: